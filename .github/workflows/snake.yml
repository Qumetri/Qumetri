# Redraws the contribution snake for the profile README once a day.
# The SVGs are pushed to the "output" branch, which the README links to.
name: Contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/duck-snake.svg?palette=github-light&color_snake=#d97706
            dist/duck-snake-dark.svg?palette=github-dark&color_snake=#f59e0b

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
